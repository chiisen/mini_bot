name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows 也必須納入：ShellTool 有平台分支，只在 Ubuntu 上跑等於
    # 從未測過 Windows 路徑（#9 的成因之一）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Confirm PowerShell 7 is available
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Run tests
        run: python -m pytest tests/ --cov=minibot --cov-report=term-missing
